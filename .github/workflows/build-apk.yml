# Builds the Android APK on every push to main (or by hand from the Actions
# tab). The .apk is attached to the run as an artifact for 14 days.
# Based on Guia_WebToAPK.md (4B), updated for Capacitor 8: JDK 21.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: JDK 21 (Capacitor 8)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      # Guard: dangerous secrets must NEVER be committed (only publishable keys
      # are allowed, and those come from GitHub secrets at build time).
      - name: No secrets committed
        run: |
          if git grep -nIE 'sb_secret_|service_role|-----BEGIN [A-Z ]*PRIVATE KEY-----|"private_key"[[:space:]]*:|"type"[[:space:]]*:[[:space:]]*"service_account"' -- . ':!.github/workflows/build-apk.yml'; then
            echo "::error::Se ha encontrado un posible secreto en el repositorio. Elimínalo y rota la clave."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Database security tests (RLS, server functions)
        run: npm run test:db

      - name: Build web app for Android (base "/") and sync Capacitor
        run: npm run android:sync
        # Public-by-design values (publishable key, referrer-restricted API key),
        # kept out of the repo and injected at build time.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: familymemories-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
