# Builds the Android APK on every push to main (or by hand from the Actions
# tab). The .apk is attached to the run as an artifact for 14 days.
# Based on Guia_WebToAPK.md (4B), updated for Capacitor 8: JDK 21.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: JDK 21 (Capacitor 8)
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'

      # Guard: dangerous secrets must NEVER be committed (only publishable keys
      # are allowed, and those come from GitHub secrets at build time).
      - name: No secrets committed
        run: |
          if git grep -nIE 'sb_secret_|service_role|-----BEGIN [A-Z ]*PRIVATE KEY-----|"private_key"[[:space:]]*:|"type"[[:space:]]*:[[:space:]]*"service_account"' -- . ':!.github/workflows/build-apk.yml'; then
            echo "::error::Se ha encontrado un posible secreto en el repositorio. Elimínalo y rota la clave."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Database security tests (RLS, server functions)
        run: npm run test:db

      - name: Build web app for Android (base "/") and sync Capacitor
        run: npm run android:sync
        # Public-by-design values (publishable key, referrer-restricted API key),
        # kept out of the repo and injected at build time.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_API_KEY: ${{ secrets.VITE_GOOGLE_API_KEY }}
          VITE_BUILD_NUMBER: ${{ github.run_number }}

      - name: Build debug APK
        working-directory: android
        # Same signing key on every build (stored only as GitHub secrets), so
        # each new APK installs over the previous one.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          FM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FM_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/familymemories.p12"
            export FM_KEYSTORE_PATH="$RUNNER_TEMP/familymemories.p12"
          fi
          export FM_VERSION_NAME="$(node -p "require('../package.json').version")"
          ./gradlew assembleDebug --no-daemon
          rm -f "$RUNNER_TEMP/familymemories.p12"
          # Versioned file name: Raices-v0.14.0-build58.apk
          APK_NAME="Raices-v${FM_VERSION_NAME}-build${FM_VERSION_CODE}"
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/$APK_NAME.apk"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ runner.temp }}/${{ env.APK_NAME }}.apk
          retention-days: 30
