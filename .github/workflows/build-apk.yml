# Builds the Android APK on every push to main (or by hand from the Actions
# tab). The .apk is attached to the run as an artifact for 14 days.
# Based on Guia_WebToAPK.md (4B), updated for Capacitor 8: JDK 21.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: JDK 21 (Capacitor 8)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build web app for Android (base "/") and sync Capacitor
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: familymemories-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
